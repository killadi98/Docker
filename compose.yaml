---
services:
  bank:
    container_name: bank-cont
    build: ./bank/
    ports:
      - "1111:80"
    networks:
      - network1
    volumes:
      - volume1:/bank-vol/
    env_file:
      - dev.env
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M

  bus:
    container_name: bus-cont
    build: ./bus/
    ports:
      - "1112:80"
    networks:
      - network2
    volumes:
      - volume2:/bus-vol/
    environment:
      APP_ENV: prod
      APP_PORT: 3000
      DB_PORT: 3306
      DB_HOST: mysql
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
                                                                  1,3           Top
  flight:
    container_name: flight-cont
    build: ./flight/
    ports:
      - "1113:80"
    networks:
      - network3
    volumes:
      - volume3:/flight-vol/
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
    depends_on:
      - train

  train:
    container_name: train-cont
    build: ./train/
    ports:
      - "1114:80"
    networks:
      - network3
    volumes:
      - volume4:/train-vol/
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M

networks:
  network1:
    driver: bridge
  network2:
    driver: bridge
  network3:
    driver: bridge
  network4:
    driver: bridge

volumes:
  volume1:
  volume2:
  volume3:
  volume4:
